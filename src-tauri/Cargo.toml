[package]
name = "tapecapture"
version = "0.1.0"
description = "Automatic content-aware capture for VHS and external video devices"
authors = ["shunmoridev"]
license = "MIT"
edition = "2021"

[lib]
name = "tapecapture_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
uuid = { version = "1", features = ["v4", "serde"] }
